trees:
  gtucker:
    url: https://gitlab.com/gtucker/linux.git
  kselftest:
    url: https://git.kernel.org/pub/scm/linux/kernel/git/shuah/linux-kselftest.git
  next:
    url: https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
  rust:
    url: https://github.com/Rust-for-Linux/linux.git
  stable:
    url: https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux-stable.git
  torvalds:
    url: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git

switchboard:

  # reload the orchestrator config when a new one is available
- task: oconfig-reload
  channel: node
  match: {kind: vixi.oconfig, op: add}
  scheduler: null

  # update a Git mirror
- task: kbuild-mirror
  channel: vixi
  match: {event: mirror}
  params: [tree]
  scheduler: tekton

  # build a kernel in Tekton
- task: kbuild
  channel: vixi
  match: {event: trigger, source: git}
  params: [tree, revision]
  scheduler: tekton-kvm  # until kboot docker images are refactored

  # boot a kernel in KubeVirt
- task: kboot-docker
  channel: node
  match: {kind: vixi.kbuild.docker, op: add}
  scheduler: tekton-kvm

  # run KUnit in Tekton
- task: kunit
  channel: vixi
  match: {event: trigger, source: git}
  params: [tree, revision]
  scheduler: tekton

  # parse KUnit results
- task: kunit-parser
  channel: task
  match: {name: kunit, op: complete}
  scheduler: inline-vixi

  # compute delta between test results
- task: delta
  channel: node
  match: {kind: vixi.group, op: populate}
  scheduler: inline-vixi

  # run a Git bisection based on found delta
- task: bisect
  channel: node
  match: {kind: vixi.delta, op: populate}
  # attributes: {data.category: break}
  scheduler: inline-vixi
