# -----------------------------------------------------------------------------
# Service Account

apiVersion: v1
kind: ServiceAccount
metadata:
  name: trigger-sa
  namespace: vixi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vixi-trigger-role-binding
  namespace: vixi
subjects:
- kind: ServiceAccount
  name: trigger-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vixi-trigger-cluster-role-binding
  namespace: vixi
subjects:
- kind: ServiceAccount
  name: trigger-sa
  namespace: vixi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---

# -----------------------------------------------------------------------------
# mirror

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kbuild-mirror-trigger-template
  namespace: vixi
spec:
  params:
  - name: uuid
  - name: tree
    default: torvalds
  - name: url
    default: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  - name: reset
    default: 'skip'
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: TaskRun
    metadata:
      generateName: kbuild-mirror-
    spec:
      taskRef:
        name: kbuild-mirror
      podTemplate:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: vixi/worker
                  operator: In
                  values: ["true"]
      timeout: "2h0m0s"
      workspaces:
      - name: sandbox
        persistentVolumeClaim:
          claimName: kbuild-sandbox
      - name: tmp
        emptyDir: {}
      params:
      - {name: uuid,       value: $(tt.params.uuid)}
      - {name: tree,       value: $(tt.params.tree)}
      - {name: url,        value: $(tt.params.url)}
      - {name: reset,      value: $(tt.params.reset)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kbuild-mirror-trigger-binding
  namespace: vixi
spec:
  params:
  - {name: uuid,       value: $(body.uuid)}
  - {name: tree,       value: $(body.tree)}
  - {name: url,        value: $(body.url)}
  - {name: reset,      value: $(body.reset)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: kbuild-mirror-trigger-listener
  namespace: vixi
spec:
  serviceAccountName: trigger-sa
  triggers:
  - name: kbuild-mirror-trigger
    bindings:
    - ref: kbuild-mirror-trigger-binding
    template:
      ref: kbuild-mirror-trigger-template
---

# -----------------------------------------------------------------------------
# kbuild

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kbuild-trigger-template
  namespace: vixi
spec:
  params:
  -  name: uuid
  -  name: storage
  -  name: tree
  -  name: url
  -  name: revision
  - {name: reset,      default: 'skip'}
  - {name: arch,       default: 'x86_64'}
  - {name: defconfig,  default: 'defconfig'}
  - {name: opts,       default: ''}
  - {name: cc,         default: 'gcc'}
  - {name: ccver,      default: '14.2'}
  - {name: ccarch,     default: '-x86'}
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: TaskRun
    metadata:
      generateName: kbuild-$(tt.params.tree)-$(tt.params.revision)-
    spec:
      taskRef:
        name: kbuild
      podTemplate:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: vixi/worker
                  operator: In
                  values: ["true"]
      timeout: "1h0m0s"
      workspaces:
      - name: sandbox
        persistentVolumeClaim:
          claimName: kbuild-sandbox
      - name: tmp
        emptyDir: {}
      params:
      - {name: uuid,       value: $(tt.params.uuid)}
      - {name: storage,    value: $(tt.params.storage)}
      - {name: tree,       value: $(tt.params.tree)}
      - {name: url,        value: $(tt.params.url)}
      - {name: revision,   value: $(tt.params.revision)}
      - {name: reset,      value: $(tt.params.reset)}
      - {name: arch,       value: $(tt.params.arch)}
      - {name: defconfig,  value: $(tt.params.defconfig)}
      - {name: opts,       value: $(tt.params.opts)}
      - {name: cc,         value: $(tt.params.cc)}
      - {name: ccver,      value: $(tt.params.ccver)}
      - {name: ccarch,     value: $(tt.params.ccarch)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kbuild-trigger-binding
  namespace: vixi
spec:
  params:
  - {name: uuid,       value: $(body.uuid)}
  - {name: storage,    value: $(body.storage)}
  - {name: tree,       value: $(body.tree)}
  - {name: url,        value: $(body.url)}
  - {name: revision,   value: $(body.revision)}
  - {name: reset,      value: $(body.reset)}
  - {name: arch,       value: $(body.arch)}
  - {name: defconfig,  value: $(body.defconfig)}
  - {name: opts,       value: $(body.opts)}
  - {name: cc,         value: $(body.cc)}
  - {name: ccver,      value: $(body.ccver)}
  - {name: ccarch,     value: $(body.ccarch)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: kbuild-trigger-listener
  namespace: vixi
spec:
  serviceAccountName: trigger-sa
  triggers:
  - name: kbuild-trigger
    bindings:
    - ref: kbuild-trigger-binding
    template:
      ref: kbuild-trigger-template
