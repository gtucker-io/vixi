apiVersion: v1
kind: ServiceAccount
metadata:
  name: vixi-trigger-account
  namespace: vixi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vixi-trigger-role-binding
  namespace: vixi
subjects:
- kind: ServiceAccount
  name: vixi-trigger-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vixi-trigger-cluster-role-binding
  namespace: vixi
subjects:
- kind: ServiceAccount
  name: vixi-trigger-account
  namespace: vixi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kbuild-mirror-trigger-template
  namespace: vixi
spec:
  params:
  - name: tree
    default: torvalds
  - name: url
    default: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: TaskRun
    metadata:
      generateName: kbuild-mirror-
    spec:
      taskRef:
        name: kbuild-mirror
      timeout: "2h0m0s"
      workspaces:
      - name: sandbox
        persistentVolumeClaim:
          claimName: kbuild-sandbox
      params:
      - name: tree
        value: $(tt.params.tree)
      - name: url
        value: $(tt.params.url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kbuild-mirror-trigger-binding
  namespace: vixi
spec:
  params:
  - name: tree
    value: $(body.tree)
  - name: url
    value: $(body.url)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: kbuild-mirror-trigger-listener
  namespace: vixi
spec:
  serviceAccountName: vixi-trigger-account
  triggers:
  - name: kbuild-mirror-trigger
    bindings:
    - ref: kbuild-mirror-trigger-binding
    template:
      ref: kbuild-mirror-trigger-template
