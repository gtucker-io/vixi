# -----------------------------------------------------------------------------
# Service Account

apiVersion: v1
kind: ServiceAccount
metadata:
  name: trigger-sa
  namespace: vixi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trigger-role-binding
  namespace: vixi
subjects:
- kind: ServiceAccount
  name: trigger-sa
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-roles
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vixi-trigger-cluster-role-binding
  namespace: vixi
subjects:
- kind: ServiceAccount
  name: trigger-sa
  namespace: vixi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener-clusterroles
---

# -----------------------------------------------------------------------------
# mirror

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kbuild-mirror-trigger-template
  namespace: vixi
spec:
  params:
  - name: uuid
  - name: tree
    default: torvalds
  - name: url
    default: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  - name: reset
    default: 'skip'
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: TaskRun
    metadata:
      generateName: kbuild-mirror-
    spec:
      taskRef:
        name: kbuild-mirror
      podTemplate:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: vixi/worker
                  operator: In
                  values: ["true"]
      timeout: "2h0m0s"
      workspaces:
      - name: sandbox
        persistentVolumeClaim:
          claimName: sandbox
      - name: tmp
        emptyDir: {}
      params:
      - {name: uuid,       value: $(tt.params.uuid)}
      - {name: tree,       value: $(tt.params.tree)}
      - {name: url,        value: $(tt.params.url)}
      - {name: reset,      value: $(tt.params.reset)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kbuild-mirror-trigger-binding
  namespace: vixi
spec:
  params:
  - {name: uuid,       value: $(body.uuid)}
  - {name: tree,       value: $(body.tree)}
  - {name: url,        value: $(body.url)}
  - {name: reset,      value: $(body.reset)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: kbuild-mirror-trigger-listener
  namespace: vixi
spec:
  serviceAccountName: trigger-sa
  triggers:
  - name: kbuild-mirror-trigger
    bindings:
    - ref: kbuild-mirror-trigger-binding
    template:
      ref: kbuild-mirror-trigger-template
---

# -----------------------------------------------------------------------------
# kbuild

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kbuild-trigger-template
  namespace: vixi
spec:
  params:
  -  name: uuid
  -  name: storage
  -  name: tree
  -  name: url
  -  name: revision
  - {name: clean,      default: 'skip'}
  - {name: filter,     default: ''}
  - {name: arch,       default: 'x86_64'}
  - {name: defconfig,  default: 'defconfig'}
  - {name: opts,       default: ''}
  - {name: cc,         default: 'gcc'}
  - {name: ccver,      default: '15.2'}
  - {name: ccarch,     default: '-x86'}
  - {name: job,        default: 'kbuild'}
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: PipelineRun
    metadata:
      generateName: kbuild-$(tt.params.tree)-$(tt.params.revision)-
    spec:
      pipelineRef:
        name: kbuild
      podTemplate:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: vixi/worker
                  operator: In
                  values: ["true"]
      timeout: "1h0m0s"
      workspaces:
      - name: sandbox
        persistentVolumeClaim:
          claimName: sandbox
      - name: artifacts
        volumeClaimTemplate:
          spec:
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
      - name: scratch
        emptyDir: {}
      params:
      - {name: uuid,       value: $(tt.params.uuid)}
      - {name: storage,    value: $(tt.params.storage)}
      - {name: tree,       value: $(tt.params.tree)}
      - {name: url,        value: $(tt.params.url)}
      - {name: revision,   value: $(tt.params.revision)}
      - {name: clean,      value: $(tt.params.clean)}
      - {name: filter,     value: $(tt.params.filter)}
      - {name: arch,       value: $(tt.params.arch)}
      - {name: defconfig,  value: $(tt.params.defconfig)}
      - {name: opts,       value: $(tt.params.opts)}
      - {name: cc,         value: $(tt.params.cc)}
      - {name: ccver,      value: $(tt.params.ccver)}
      - {name: ccarch,     value: $(tt.params.ccarch)}
      - {name: job,        value: $(tt.params.job)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kbuild-trigger-binding
  namespace: vixi
spec:
  params:
  - {name: uuid,       value: $(body.uuid)}
  - {name: storage,    value: $(body.storage)}
  - {name: tree,       value: $(body.tree)}
  - {name: url,        value: $(body.url)}
  - {name: revision,   value: $(body.revision)}
  - {name: clean,      value: $(body.clean)}
  - {name: filter,     value: $(body.filter)}
  - {name: arch,       value: $(body.arch)}
  - {name: defconfig,  value: $(body.defconfig)}
  - {name: opts,       value: $(body.opts)}
  - {name: cc,         value: $(body.cc)}
  - {name: ccver,      value: $(body.ccver)}
  - {name: ccarch,     value: $(body.ccarch)}
  - {name: job,        value: $(body.job)}
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: kbuild-trigger-listener
  namespace: vixi
spec:
  serviceAccountName: trigger-sa
  triggers:
  - name: kbuild-trigger
    bindings:
    - ref: kbuild-trigger-binding
    template:
      ref: kbuild-trigger-template
---

# -----------------------------------------------------------------------------
# kboot

apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: kboot-trigger-template
  namespace: vixi
spec:
  params:
  - name: uuid
  - name: parent
  - name: storage
  - name: kernel-image
  resourcetemplates:
  - apiVersion: tekton.dev/v1beta1
    kind: PipelineRun
    metadata:
      generateName: kboot-
    spec:
      pipelineRef:
        name: kboot
      serviceAccountName: kubevirt-sa
      podTemplate:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: vixi/kvm-worker
                  operator: In
                  values: ["true"]
      timeout: "1h0m0s"
      params:
      - { name: uuid,         value: $(tt.params.uuid)         }
      - { name: parent,       value: $(tt.params.parent)       }
      - { name: storage,      value: $(tt.params.storage)      }
      - { name: kernel-image, value: $(tt.params.kernel-image) }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: kboot-trigger-binding
  namespace: vixi
spec:
  params:
  - { name: uuid,         value: $(body.uuid)         }
  - { name: parent,       value: $(body.parent)       }
  - { name: storage,      value: $(body.storage)      }
  - { name: kernel-image, value: $(body.kernel-image) }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: kboot-trigger-listener
  namespace: vixi
spec:
  serviceAccountName: trigger-sa
  triggers:
  - name: kboot-trigger
    bindings:
    - ref: kboot-trigger-binding
    template:
      ref: kboot-trigger-template
---

