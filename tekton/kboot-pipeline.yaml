apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kboot
  namespace: vixi
spec:
  params:
  - name: vmName
    default: $(context.pipelineRun.name)-vm
  - name: publicKeySecretName
    default: $(context.pipelineRun.name)-public-key
  - name: privateKeySecretName
    default: $(context.pipelineRun.name)-private-key
  - name: uuid
  - name: storage
  - name: kbuild-node-id
  - name: image-node-id
  - name: modules-node-id
  results:
  - name: node-id
    value: $(tasks.summary.results.node-id)
    description: Id of the boot summary node in the database
  workspaces:
  - name: artifacts
  tasks:
    # ToDo: Get revision, build metadata etc. from kbuild node to populate an
    # environment file in the shared volume and include in results.
    #
    # ToDo: Upload artifacts with path prefix e.g.:
    # ${TREE}/${BRANCH}/${DESCRIBE}/${ARCH}

  - name: docker
    taskSpec:
      results:
      - name: kernel-image
      workspaces:
      - name: artifacts
      volumes:
      - name: dind-socket
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: api-key
        secret:
          secretName: api-key
      - name: sandbox
        persistentVolumeClaim:
          claimName: kboot

      steps:
      - name: artifacts
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        workingDir: $(workspaces.artifacts.path)
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        env:
        - { name: IMAGE_ID,  value: $(params.image-node-id)  }
        script: |
          # ToDo: use summary parent node and download modules.tar.gz too
          renelick storage get "${IMAGE_ID}"
          ls -l

      - name: images
        image: docker:28.3.3
        workingDir: $(workspaces.artifacts.path)
        volumeMounts:
        - name: dind-socket
          mountPath: /var/run/docker.sock
        env:
        - { name: UUID,    value: $(params.uuid)    }
        script: |
          #!/usr/bin/env ash
          set -eo pipefail
          tag="kernel-image:${UUID}"
          echo "FROM scratch" > Dockerfile
          echo "ADD --chown=107:107 bzImage boot/bzImage" >> Dockerfile
          docker build . --no-cache --tag "${tag}"
          echo "${tag}" | tee $(results.kernel-image.path)

  - name: generate-ssh-keys
    taskRef:
      kind: Task
      name: generate-ssh-keys
    params:
    - name: publicKeySecretName
      value: $(params.publicKeySecretName)
    - name: privateKeySecretName
      value: $(params.privateKeySecretName)
    - name: privateKeyConnectionOptions
      value:
      - 'user:ubuntu'
      - 'disable-strict-host-key-checking:true'
    - name: additionalSSHKeygenOptions
      value: '-t rsa'

  - name: create-vm-from-manifest
    runAfter:
    - docker-image
    taskRef:
      kind: Task
      name: create-vm-from-manifest
    runAfter:
    - generate-ssh-keys
    params:
    - name: manifest
      value: |
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: $(params.vmName)
        spec:
          running: false
          template:
            metadata:
              labels:
                kubevirt.io/domain: $(params.vmName)
            spec:
              accessCredentials:
              - sshPublicKey:
                  source:
                    secret:
                      secretName: $(params.publicKeySecretName)
                  propagationMethod:
                    configDrive: {}
              hostname: $(params.vmName)
              nodeSelector:
                vixi/kvm-worker: "true"
              domain:
                cpu:
                  cores: 2
                  sockets: 1
                  threads: 1
                firmware:
                  kernelBoot:
                    container:
                      image: $(tasks.docker.results.kernel-image)
                      # ToDo: include modules in initrd.cpio
                      # initrdPath: /boot/initrd.cpio
                      kernelPath: /boot/bzImage
                      imagePullPolicy: IfNotPresent
                    kernelArgs: console=ttyS0 root=/dev/vda1 rw setenforce 0
                devices:
                  disks:
                  - name: containerdisk
                    disk:
                      bus: virtio
                  - name: cloudinitdisk
                    disk:
                      bus: virtio
                  - name: sandbox
                    disk:
                      bus: virtio
                  interfaces:
                  - name: default
                    masquerade: {}
                    ports:
                    - name: ssh
                      port: 22
                  networkInterfaceMultiqueue: true
                  rng: {}
                resources:
                  requests:
                    memory: 1Gi
              networks:
              - name: default
                pod: {}
              terminationGracePeriodSeconds: 0
              volumes:
              - name: containerdisk
                containerDisk:
                  image: quay.io/containerdisks/ubuntu:24.04
              - name: cloudinitdisk
                cloudInitConfigDrive:
                  userData: |
                    #cloud-config
              - name: sandbox
                persistentVolumeClaim:
                  claimName: kboot

  - name: payload
    taskRef:
      kind: Task
      name: execute-in-vm
    runAfter:
    - create-vm-from-manifest
    params:
    - name: vmName
      value: "$(params.vmName)"
    - name: secretName
      value: "$(params.privateKeySecretName)"
    - name: script
      value: |
        lsblk
        sudo dmesg | head -2

        sudo mkdir -p /mnt/sandbox
        sudo mount /dev/vdc /mnt/sandbox
        sudo mkdir -p "/mnt/sandbox/$(context.pipelineRun.uid)"
        sudo chown ubuntu: -R "/mnt/sandbox/$(context.pipelineRun.uid)"
        export ARTIFACTS="/mnt/sandbox/$(context.pipelineRun.uid)"

        sudo dmesg > "${ARTIFACTS}/dmesg.txt"
        cat /proc/cpuinfo > "${ARTIFACTS}/cpuinfo.txt"
        cat /proc/meminfo > "${ARTIFACTS}/meminfo.txt"
        echo '{
          "system": "'"$(uname -a)"'",
          "nproc": "'"$(nproc)"'"
        }' > "${ARTIFACTS}/metadata.json"

        sudo umount /mnt/sandbox

  - name: summary
    runAfter:
    - payload
    taskSpec:
      results:
      - name: node-id
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      - name: sandbox
        persistentVolumeClaim:
          claimName: kboot
      steps:
      - name: summary
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: sandbox
          mountPath: /home/renelick/sandbox
        securityContext:
          privileged: True
          runAsUser: 0
        env:
        - { name: UUID,      value: $(params.uuid)           }
        - { name: PARENT,    value: $(params.kbuild-node-id) }
        - { name: STORAGE,   value: $(params.storage)        }
        script: |
          #!/usr/bin/env bash
          set -eo pipefail

          [ -z "${PARENT}" ] && {
              echo "ERROR - no parent node defined"
              exit 1
          }
          [ -e /dev/loop0 ] || mknod /dev/loop0 b 7 0
          loopdev=$(losetup --find --show sandbox/disk.img)
          mkdir -p /tmp/sandbox-disk
          mount sandbox/disk.img /tmp/sandbox-disk
          export ARTIFACTS="/tmp/sandbox-disk/$(context.pipelineRun.uid)"

          [ -z "${STORAGE}" ] && {
              echo "WARNING - no storage defined, artifacts will not be saved"
              exit 0
          }

          [ -d "${ARTIFACTS}" ] && {
              cd "${ARTIFACTS}"
              [ -n "${UUID}" ] && {
                  su renelick bash -c 'renelick task get "${UUID}" > task.json'
              } && {
                  export TOPT="task__json=task.json"
              } || {
                  echo "WARNING - failed to get task from UUID"
              }
              su renelick bash -c '\
                  renelick task get "${UUID}" > task.json; \
                  renelick node make \
                      name="kboot" \
                      kind="vixi.kboot" \
                      parent="${PARENT}" \
                      ${TOPT} \
                      data__json=metadata.json \
                  | renelick node add - | tee $(results.node-id.path); \
              '
              export POPT="parent=$(cat $(results.node-id.path) | tr -d \n)"
              [ -n "${STORAGE}" ] && [ -n "${TOPT}" ] && {
                  find . -type f -not -name "*.json" | while read path; do
                      export FILE="$(basename ${path})"
                      echo "Uploading ${FILE}"
                      export URL=$(su renelick bash -c '\
                          renelick storage upload "${FILE}" \
                          --storage="${STORAGE}" \
                          --dest="kboot-${UUID}" \
                      ')
                      echo "URL ${URL}"
                      su renelick bash -c '\
                          renelick node make \
                              name="${FILE}" \
                              kind="artifact-v1" \
                              ${POPT} \
                              ${TOPT} \
                              data.url="${URL}" \
                              data.storage="ssh" \
                          | renelick node add -; \
                      '
                  done
              } || {
                  echo "WARNING - not saving artifacts"
              }
              cd "${HOME}"
              rm -rf "${ARTIFACTS}"
          }

          umount /tmp/sandbox-disk
          losetup --detach "${loopdev}"

  finally:
  - name: complete
    taskSpec:
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      steps:
      - name: summary
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        env:
        - { name: UUID,    value: $(params.uuid)    }
        script: |
          [ -n "${UUID}" ] && renelick task complete "${UUID}"

  - name: cleanup
    taskRef:
      kind: Task
      name: cleanup-vm
    params:
    - name: vmName
      value: "$(params.vmName)"
    - name: secretName
      value: "$(params.privateKeySecretName)"
    - name: delete
      value: "true"
    - name: timeout
      value: "5m"
    - name: script
      value: |
        # ToDo: add status to summary node
        echo "Result $(tasks.payload.status)"
        echo "Tasks $(tasks.status)"
