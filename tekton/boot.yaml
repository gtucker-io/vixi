# Sample Renelick command to trigger a pipeline run:
#
# rk task run tekton \
#     name=boot \
#     kernel-image=docker.io/gtucker/kernel-image:f18f88ba-3e13-4942-a366-af02d13ff26f \
#     parent=68c17b99340dd1e4781f2f38

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: boot-sandbox-init
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  steps:
  - name: directory
    image: alpine:3.22.1
    workingDir: $(workspaces.sandbox.path)
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      apk add e2fsprogs  # ToDo: include in Docker image

      [ -f disk.img ] || {
          truncate -s 10G disk.img
          mkfs.ext4 disk.img
      }

      ls -lh
      fsck.ext4 -p disk.img
---

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: boot
  namespace: vixi
spec:
  params:
  - name: vmName
    default: $(context.pipelineRun.name)-vm
  - name: publicKeySecretName
    default: $(context.pipelineRun.name)-public-key
  - name: privateKeySecretName
    default: $(context.pipelineRun.name)-private-key
  - name: uuid
  - name: parent
  - name: storage
  - name: kernel-image
  results:
  - name: node-id
    value: $(tasks.summary.results.node-id)
    description: Id of the boot summary node in the database
  tasks:
    # ToDo: Download parent node and get kernel Docker image name from it as
    # well as revision, build metadata etc. to populate an environment file in
    # the shared volume like for the kbuild pipeline.
    #
    # ToDo: Upload artifacts with path prefix e.g.:
    # ${TREE}/${BRANCH}/${DESCRIBE}/${ARCH}

  - name: generate-ssh-keys
    taskRef:
      kind: Task
      name: generate-ssh-keys
    params:
    - name: publicKeySecretName
      value: $(params.publicKeySecretName)
    - name: privateKeySecretName
      value: $(params.privateKeySecretName)
    - name: privateKeyConnectionOptions
      value:
      - 'user:ubuntu'
      - 'disable-strict-host-key-checking:true'
    - name: additionalSSHKeygenOptions
      value: '-t rsa'
  - name: create-vm-from-manifest
    taskRef:
      kind: Task
      name: create-vm-from-manifest
    runAfter:
    - generate-ssh-keys
    params:
    - name: manifest
      value: |
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          name: $(params.vmName)
        spec:
          running: false
          template:
            metadata:
              labels:
                kubevirt.io/domain: $(params.vmName)
            spec:
              accessCredentials:
              - sshPublicKey:
                  source:
                    secret:
                      secretName: $(params.publicKeySecretName)
                  propagationMethod:
                    configDrive: {}
              hostname: $(params.vmName)
              nodeSelector:
                vixi/kvm-worker: "true"
              domain:
                cpu:
                  cores: 2
                  sockets: 1
                  threads: 1
                firmware:
                  kernelBoot:
                    container:
                      image: $(params.kernel-image)
                      # ToDo: include modules in initrd.cpio
                      # initrdPath: /boot/initrd.cpio
                      kernelPath: /boot/bzImage
                      imagePullPolicy: IfNotPresent
                    kernelArgs: console=ttyS0 root=/dev/vda1 rw setenforce 0
                devices:
                  disks:
                  - name: containerdisk
                    disk:
                      bus: virtio
                  - name: cloudinitdisk
                    disk:
                      bus: virtio
                  - name: sandbox
                    disk:
                      bus: virtio
                  interfaces:
                  - name: default
                    masquerade: {}
                    ports:
                    - name: ssh
                      port: 22
                  networkInterfaceMultiqueue: true
                  rng: {}
                resources:
                  requests:
                    memory: 1Gi
              networks:
              - name: default
                pod: {}
              terminationGracePeriodSeconds: 0
              volumes:
              - name: containerdisk
                containerDisk:
                  image: quay.io/containerdisks/ubuntu:24.04
              - name: cloudinitdisk
                cloudInitConfigDrive:
                  userData: |
                    #cloud-config
              - name: sandbox
                persistentVolumeClaim:
                  claimName: boot-sandbox

  - name: payload
    taskRef:
      kind: Task
      name: execute-in-vm
    runAfter:
    - create-vm-from-manifest
    params:
    - name: vmName
      value: "$(params.vmName)"
    - name: secretName
      value: "$(params.privateKeySecretName)"
    - name: script
      value: |
        lsblk
        sudo dmesg | head -2

        sudo mkdir -p /mnt/sandbox
        sudo mount /dev/vdc /mnt/sandbox
        sudo mkdir -p "/mnt/sandbox/$(context.pipelineRun.uid)"
        sudo chown ubuntu: -R "/mnt/sandbox/$(context.pipelineRun.uid)"
        export ARTIFACTS="/mnt/sandbox/$(context.pipelineRun.uid)"

        sudo dmesg > "${ARTIFACTS}/dmesg.txt"
        cat /proc/cpuinfo > "${ARTIFACTS}/cpuinfo.txt"
        cat /proc/meminfo > "${ARTIFACTS}/meminfo.txt"
        echo '{
          "system": "'"$(uname -a)"'",
          "nproc": "'"$(nproc)"'"
        }' > "${ARTIFACTS}/metadata.json"

        sudo umount /mnt/sandbox

  - name: summary
    runAfter:
    - payload
    taskSpec:
      results:
      - name: node-id
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      - name: sandbox
        persistentVolumeClaim:
          claimName: boot-sandbox
      steps:
      - name: summary
        image: registry.gitlab.com/gtucker.io/renelick:main
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: sandbox
          mountPath: /home/renelick/sandbox
        securityContext:
          privileged: True
          runAsUser: 0
        env:
        - { name: UUID,    value: $(params.uuid)    }
        - { name: PARENT,  value: $(params.parent)  }
        - { name: STORAGE, value: $(params.storage) }
        script: |
          [ -z "${PARENT}" ] && {
              echo "ERROR - no parent node defined"
              exit 1
          }
          [ -e /dev/loop0 ] || mknod /dev/loop0 b 7 0
          loopdev=$(losetup --find --show sandbox/disk.img)
          mkdir -p /tmp/sandbox-disk
          mount sandbox/disk.img /tmp/sandbox-disk
          export ARTIFACTS="/tmp/sandbox-disk/$(context.pipelineRun.uid)"

          [ -z "${STORAGE}" ] && {
              echo "WARNING - no storage defined, artifacts will not be saved"
              exit 0
          }

          [ -d "${ARTIFACTS}" ] && {
              cd "${ARTIFACTS}"
              [ -n "${UUID}" ] && {
                  su renelick bash -c 'renelick task get "${UUID}" > task.json'
              } && {
                  export TOPT="task__json=task.json"
              } || {
                  echo "WARNING - failed to get task from UUID"
              }
              su renelick bash -c '\
                  renelick task get "${UUID}" > task.json; \
                  renelick node make \
                      name="boot" \
                      kind="vixi.boot" \
                      parent="${PARENT}" \
                      ${TOPT} \
                      data__json=metadata.json \
                  | renelick node add - | tee $(results.node-id.path); \
              '
              export POPT="parent=$(cat $(results.node-id.path) | tr -d \n)"
              [ -n "${STORAGE}" ] && [ -n "${TOPT}" ] && {
                  find . -type f -not -name "*.json" | while read path; do
                      export FILE="$(basename ${path})"
                      echo "Uploading ${FILE}"
                      export URL=$(su renelick bash -c '\
                          renelick storage upload "${FILE}" \
                          --storage="${STORAGE}" \
                          --dest="boot-${UUID}" \
                      ')
                      echo "URL ${URL}"
                      su renelick bash -c '\
                          renelick node make \
                              name="${FILE}" \
                              kind="artifact-v1" \
                              ${POPT} \
                              ${TOPT} \
                              data.url="${URL}" \
                              data.storage="ssh" \
                          | renelick node add -; \
                      '
                  done
              } || {
                  echo "WARNING - not saving artifacts"
              }
              cd "${HOME}"
              rm -rf "${ARTIFACTS}"
          }

          umount /tmp/sandbox-disk
          losetup --detach "${loopdev}"

  finally:
  - name: complete
    taskSpec:
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      steps:
      - name: summary
        image: registry.gitlab.com/gtucker.io/renelick:main
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        env:
        - { name: UUID,    value: $(params.uuid)    }
        script: |
          [ -n "${UUID}" ] && renelick task complete "${UUID}"

  - name: cleanup
    taskRef:
      kind: Task
      name: cleanup-vm
    params:
    - name: vmName
      value: "$(params.vmName)"
    - name: secretName
      value: "$(params.privateKeySecretName)"
    - name: delete
      value: "true"
    - name: timeout
      value: "5m"
    - name: script
      value: |
        # ToDo: add status to summary node
        echo "Result $(tasks.payload.status)"
        echo "Tasks $(tasks.status)"
