apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: kbuild-mirror-
spec:
  taskRef:
    name: kbuild-mirror
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: vixi/worker
              operator: In
              values: ["true"]
  timeout: "2h0m0s"
  workspaces:
  - name: common
    persistentVolumeClaim:
      claimName: common
  - name: scratch
    emptyDir: {}
  params:
  - {name: uuid,       value: ''}
  - {name: tree,       value: 'gtucker'}
  - {name: url,        value: 'https://gitlab.com/gtucker/linux.git'}
  - {name: reset,      value: ''}
