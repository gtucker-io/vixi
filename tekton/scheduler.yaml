apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: vixi
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: vixi/app
                operator: In
                values: ['true']
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      containers:
      - name: scheduler
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        command: ['renelick', 'service', 'scheduler', '--runtime=tekton']
