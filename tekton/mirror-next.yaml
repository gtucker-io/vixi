apiVersion: tekton.dev/v1beta1
kind: TaskRun
metadata:
  generateName: kbuild-mirror-
spec:
  taskRef:
    name: kbuild-mirror
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: vixi/worker
              operator: In
              values: ["true"]
  timeout: "2h0m0s"
  workspaces:
  - name: sandbox
    persistentVolumeClaim:
      claimName: sandbox
  - name: tmp
    emptyDir: {}
  params:
  - {name: uuid,       value: ''}
  - {name: tree,       value: 'next'}
  - {name: url,        value: 'https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git'}
  - {name: reset,      value: ''}
