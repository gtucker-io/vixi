apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kunit-scripts
  namespace: vixi
spec:
  workspaces:
  - name: common
  - name: sandbox
  - name: artifacts
  steps:
  # ToDo: consolidate with vixi.kbuild as a common set of Git checkout tools
  - &script-step
    name: checkout
    image: alpine:3.22.1
    workingDir: $(workspaces.artifacts.path)
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    env: [{ name: STEP, value: checkout }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      MIRROR="$(workspaces.common.path)/mirror/${TREE}.git"
      EXEC="${STEP}"-script
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${EXEC}" <<EOF
      #!$(workspaces.common.path)/venv/bin/python
      import vixi.kbuild
      vixi.kbuild.env_checkout(
          '$(workspaces.artifacts.path)',
          '$(workspaces.sandbox.path)',
          '$(workspaces.common.path)/mirror',
      )
      EOF

      cat "${EXEC}"
      chmod 0755 "${EXEC}"

  - <<: *script-step
    name: build
    env: [{ name: STEP, value: build }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      EXEC="${STEP}"-script
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${EXEC}" <<EOF
      #!/usr/bin/env bash
      set -eo pipefail

      cd "${TREE}"
      mkdir -p "${BDIR}"
      tools/testing/kunit/kunit.py build \
          --build_dir="${BDIR}" \
          --arch="${ARCH}" \
          --cross_compile=x86_64-linux-
      make O="${BDIR}" defconfig
      make O="${BDIR}" savedefconfig
      ln -s "\$(pwd)/${BDIR}/defconfig" "${PWD}/defconfig"
      ln -s "\$(pwd)/${BDIR}/arch/${ARCH}/boot/bzImage" "${PWD}/bzImage"
      EOF

      cat "${EXEC}"
      chmod 0755 "${EXEC}"

  - <<: *script-step
    name: exec
    env: [{ name: STEP, value: exec }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      . $(workspaces.artifacts.path)/global.env
      EXEC="${STEP}"-script
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${EXEC}" <<EOF
      #!/usr/bin/env bash
      set -eo pipefail

      cd "${TREE}"
      tools/testing/kunit/kunit.py exec \
          --build_dir="${BDIR}" \
          --arch="${ARCH}" \
          --cross_compile=x86_64-linux- \
          --json="${PWD}/kunit.json" \
          ${FILTER}
      EOF

      cat "${EXEC}"
      chmod 0755 "${EXEC}"
---

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kunit
  namespace: vixi
spec:
  params:
  -   name: uuid
  -   name: storage
  -   name: tree
  -   name: url
  -   name: revision
  - { name: patches,    default: ''                                  }
  -   name: arch
  -   name: defconfig
  -   name: opts
  -   name: cc
  -   name: ccver
  -   name: ccarch
  - { name: filter,     default: ''                                  }
  - { name: registry,   default: 'docker.io/gtucker/korg-'           }
  - { name: job,        default: 'kunit'                             }
  - { name: flags,      default: ''                                  }
  workspaces:
  - name: common
  - name: sandbox
  - name: artifacts
  tasks:

  # ---------------------------------------------------------------------------
  # init
  #
  - name: init
    taskRef:
      name: kbuild-init
    workspaces:
    - name: common
    - name: artifacts
    params:
    - { name: job,        value: $(params.job)        }
    - { name: uuid,       value: $(params.uuid)       }
    - { name: storage,    value: $(params.storage)    }
    - { name: filter,     value: $(params.filter)     }
    - { name: tree,       value: $(params.tree)       }
    - { name: url,        value: $(params.url)        }
    - { name: revision,   value: $(params.revision)   }
    - { name: patches,    value: $(params.patches)    }
    - { name: arch,       value: $(params.arch)       }
    - { name: defconfig,  value: $(params.defconfig)  }
    - { name: opts,       value: $(params.opts)       }
    - { name: cc,         value: $(params.cc)         }
    - { name: ccver,      value: $(params.ccver)      }
    - { name: ccarch,     value: $(params.ccarch)     }
    - { name: flags,      value: $(params.flags)      }

  # ---------------------------------------------------------------------------
  # build scripts
  #
  - name: scripts
    runAfter:
    - init
    taskRef:
      name: kunit-scripts
    workspaces:
    - name: common
    - name: sandbox
    - name: artifacts

  # ---------------------------------------------------------------------------
  # checkout
  #
  - &step-task
    name: checkout
    runAfter:
    - scripts
    taskRef:
      name: step-run
    workspaces:
    - name: common
    - name: sandbox
    - name: artifacts
    params:
    - { name: step,    value: checkout                                      }
    - { name: image,   value: registry.gitlab.com/gtucker.io/renelick:main  }
    - { name: parent,  value: ''                                            }

  # ---------------------------------------------------------------------------
  # build
  #
  - <<: *step-task
    name: build
    runAfter:
    - checkout
    params:
    - &ccimage
      name: image
      value: $(params.registry)$(params.cc):$(params.ccver)-x86$(params.ccarch)-kunit
    - name: step
      value: build
    - name: parent
      value: $(tasks.checkout.results.node-id)

  # ---------------------------------------------------------------------------
  # exec
  #
  - <<: *step-task
    name: exec
    runAfter:
    - build
    params:
    - <<: *ccimage
    - { name: step,        value: exec                                      }
    - { name: parent,      value: $(tasks.build.results.node-id)            }

  # ---------------------------------------------------------------------------
  # cleanup
  #
  finally:
  - name: cleanup
    params:
    - { name: uuid,        value: $(params.uuid)                            }
    - { name: status,      value: $(tasks.status)                           }
    taskSpec:
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      params:
      - name: uuid
      - name: status
      workspaces:
      - name: common
      - name: artifacts
      steps:
      - name: summary
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        env:
        - { name: UUID, value: $(params.uuid) }
        script: |
          #!$(workspaces.common.path)/venv/bin/python
          import vixi.kbuild
          vixi.write_string(
              '$(workspaces.artifacts.path)/result', '$(params.status)'
          )
          steps = ['checkout', 'build', 'exec']
          node = vixi.kbuild.add_results(
              '$(workspaces.artifacts.path)', steps, 'kunit'
          )
          if node:
              print('  '.join((node.id, node.name)))
          vixi.complete()
