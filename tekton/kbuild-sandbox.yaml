apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-sandbox-init
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  steps:
  - name: directory
    image: alpine:3.22.1
    workingDir: $(workspaces.sandbox.path)
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      mkdir -p kbuild
      mkdir -p mirror
      ls -l
---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-mirror
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  - name: tmp
  params:
  - name: uuid
  - name: tree
  - name: url
  - name: reset
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  steps:
  - name: mirror
    image: alpine/git:v2.49.1
    workingDir: $(workspaces.sandbox.path)/mirror
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/mirror-start"

      tree=$(params.tree)
      url=$(params.url)
      echo "Tree: $(params.tree)"
      echo "URL:  $(params.url)"

      echo "Current mirrors:"
      find . -type d -name "*.git" | xargs du -hs

      [ "$(params.reset)" == "all" ] && {
          echo "Resetting all the mirrors"
          rm -rf *.git
      }

      if [ -d linux.git ]; then
          cd linux.git
          pwd
          git remote update
          git branch
          git log -n1
          cd - >/dev/null
      else
          git clone --mirror --verbose \
              https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      fi

      [ "$(params.reset)" == "true" ] && {
          echo Resetting mirror for $tree.git
          rm -rf "$tree.git"
      }

      [ -d "$tree".git ] || {
          echo "Initialising $tree.git"
          git clone --mirror --verbose --reference=linux.git "$url" "$tree".git
      }

      cd "$tree".git
      pwd
      git remote set-url origin "$url"
      git remote update --prune
      git branch
      git log -n1
      du -hs
      cd - >/dev/null
      df -h $(workspaces.sandbox.path)
      date -Iseconds > "$(workspaces.tmp.path)/mirror-end"

  - name: mirror-node
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    workingDir: $(workspaces.sandbox.path)/mirror/$(params.tree).git
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      git config --global --add safe.directory \
          "$(workspaces.sandbox.path)/mirror/$(params.tree).git"
      git log -n1 > $(workspaces.tmp.path)/git-head.txt
      if [ -n "$(params.uuid)" ]; then
          renelick task get $(params.uuid) > $(workspaces.tmp.path)/task.json
          task_param="task__json=$(workspaces.tmp.path)/task.json"
      else
          task_param="task__null="
      fi
      renelick node make \
          name="kbuild-mirror-$(params.tree)" \
          kind="vixi.mirror" \
          ${task_param} \
          data.revision.sha1="${sha1}" \
          data.revision.describe="$(git describe)" \
          data.revision.subject="$(git show --format=%s -s)" \
          data.revision.tree="$(params.tree)" \
          data.revision.url="$(params.url)" \
          data.git-head__file="$(workspaces.tmp.path)/git-head.txt" \
          data.start-time="$(cat $(workspaces.tmp.path)/mirror-start)" \
          data.end-time="$(cat $(workspaces.tmp.path)/mirror-end)" \
      | renelick node add -
      [ -n "$(params.uuid)" ] && renelick task complete $(params.uuid)
