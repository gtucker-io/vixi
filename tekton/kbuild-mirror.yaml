apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: kbuild-mirror-
  namespace: vixi
spec:
  taskRef:
    name: kbuild-mirror
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: vixi/worker
              operator: In
              values: ["true"]
  timeout: "2h0m0s"
  workspaces:
  - name: sandbox
    persistentVolumeClaim:
      claimName: kbuild-sandbox
  - name: tmp
    emptyDir: {}
