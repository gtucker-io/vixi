apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-mirror
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  - name: tmp
  params:
  - name: uuid
  - name: tree
  - name: url
  - name: reset
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  steps:
  - name: mirror
    image: alpine/git:v2.49.1
    workingDir: $(workspaces.sandbox.path)/mirror
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    env:
    - { name: TREE,       value: $(params.tree)      }
    - { name: URL,        value: $(params.url)       }
    - { name: RESET,      value: $(params.reset)     }
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/mirror-start"

      tree="${TREE}"
      url="${URL}"
      echo "Tree: ${TREE}"
      echo "URL:  ${URL}"

      echo "Current mirrors:"
      find . -type d -name "*.git" | xargs du -hs

      [ "${RESET}" == "all" ] && {
          echo "Resetting all the mirrors"
          rm -rf *.git
      }

      if [ -d linux.git ]; then
          cd linux.git
          pwd
          git remote update
          git log -n1
          cd - >/dev/null
      else
          git clone --mirror --verbose \
              https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      fi

      [ "${RESET}" == "true" ] && {
          echo Resetting mirror for ${TREE}.git
          rm -rf "${TREE}.git"
      }

      [ -d "${TREE}".git ] || {
          echo "Initialising ${TREE}.git"
          git clone --mirror --verbose --reference=linux.git "${URL}" "${TREE}".git
      }

      cd "${TREE}".git
      pwd
      git remote set-url origin "$url"
      git remote update --prune
      git branch
      git log -n1
      du -hs
      cd - >/dev/null
      df -h $(workspaces.sandbox.path)
      date -Iseconds > "$(workspaces.tmp.path)/mirror-end"

  - name: mirror-node
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    workingDir: $(workspaces.sandbox.path)/mirror
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    env:
    - { name: UUID,       value: $(params.uuid)                  }
    - { name: TREE,       value: $(params.tree)                  }
    - { name: URL,        value: $(params.url)                   }
    - { name: PYTHONPATH, value: $(workspaces.sandbox.path)/vixi }
    script: |
      #!/usr/bin/env python
      import vixi.kbuild
      node = vixi.kbuild.mirror_node('$(workspaces.tmp.path)')
      vixi.complete()
      print(node.id)
---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-init
  namespace: vixi
spec:
  params:
  -   name: job
  - { name: uuid,       default: ''          }
  - { name: storage,    default: ''          }
  - { name: clean,      default: 'skip'      }
  - { name: filter,     default: ''          }
  -   name: tree
  -   name: url
  -   name: revision
  -   name: arch
  -   name: defconfig
  -   name: opts
  -   name: cc
  -   name: ccver
  -   name: ccarch
  results:
  - name: node-id
    description: Id of the database root node
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  workspaces:
  - name: sandbox
  - name: artifacts
  steps:
  - name: init
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    env:
    - { name: JOB,        value: $(params.job)                   }
    - { name: UUID,       value: $(params.uuid)                  }
    - { name: STORAGE,    value: $(params.storage)               }
    - { name: CLEAN,      value: $(params.clean)                 }
    - { name: FILTER,     value: $(params.filter)                }
    - { name: TREE,       value: $(params.tree)                  }
    - { name: URL,        value: $(params.url)                   }
    - { name: REVISION,   value: $(params.revision)              }
    - { name: ARCH,       value: $(params.arch)                  }
    - { name: DEFCONFIG,  value: $(params.defconfig)             }
    - { name: OPTS,       value: $(params.opts)                  }
    - { name: CC,         value: $(params.cc)                    }
    - { name: CCVER,      value: $(params.ccver)                 }
    - { name: CCARCH,     value: $(params.ccarch)                }
    - { name: PYTHONPATH, value: $(workspaces.sandbox.path)/vixi }
    script: |
      #!/usr/bin/env python
      import vixi.kbuild
      artifacts = '$(workspaces.artifacts.path)'
      vixi.kbuild.save_env(artifacts)
      vixi.kbuild.save_params(artifacts)
      vixi.kbuild.dump_info(artifacts)
---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-scripts
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  - name: artifacts
  steps:
  - &script-step
    name: checkout
    image: alpine:3.22.1
    workingDir: $(workspaces.artifacts.path)
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    env: [{ name: STEP, value: checkout }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      MIRROR="$(workspaces.sandbox.path)/mirror/${TREE}.git"
      SCRIPT="${STEP}.sh"
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${SCRIPT}" <<EOF
      #!/usr/bin/env ash
      set -eo pipefail

      echo "Tree:     $TREE"
      echo "URL:      $URL"
      echo "Revision: $REVISION"

      [ "${CLEAN}" == "true" ] && {
          echo "Doing a clean build with new checkout for ${TREE}"
          rm -rf "${TREE}"
      }

      if [ ! -d "$TREE" ]; then
          git clone --reference-if-able="$MIRROR" -v "$URL" "$TREE"
      fi

      cd "$TREE"
      git remote -v
      git fetch --tags origin "$REVISION"
      git checkout FETCH_HEAD
      git fetch --tags \
          https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      git log -n1
      du -hs .git
      echo "export DESCRIBE=\"\$(git describe --always)\"" \
           >> $(workspaces.artifacts.path)/source.env
      EOF

      cat "${SCRIPT}"
      chmod 0755 "${SCRIPT}"

  - <<: *script-step
    name: defconfig
    env: [{ name: STEP, value: defconfig }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      SCRIPT="${STEP}.sh"
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${SCRIPT}" <<EOF
      #!/usr/bin/env bash
      set -eo pipefail

      echo "Tree:          ${TREE}"
      echo "Architecture:  ${ARCH}"
      echo "Compiler:      ${CC}-${CCVER}"
      echo "Options:       ${OPTS}"

      cd "${TREE}"
      mkdir -p "${BDIR}"
      make O="${BDIR}" ${OPTS} ${DEFCONFIG}
      make O="${BDIR}" ${OPTS} savedefconfig
      ln -s "\$(pwd)/${BDIR}/defconfig" "${PWD}/defconfig"
      EOF

      cat "${SCRIPT}"
      chmod 0755 "${SCRIPT}"

  - <<: *script-step
    name: image
    env: [{ name: STEP, value: image }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      SCRIPT="${STEP}.sh"
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${SCRIPT}" <<EOF
      #!/usr/bin/env bash
      set -eo pipefail

      cd "${TREE}"
      make O="${BDIR}" ${OPTS} -j$(nproc) bzImage
      ln -s "\$(pwd)/${BDIR}/arch/${ARCH}/boot/bzImage" "${PWD}/bzImage"
      EOF

      cat "${SCRIPT}"
      chmod 0755 "${SCRIPT}"

  - <<: *script-step
    name: modules
    env: [{ name: STEP, value: modules }]
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      . $(workspaces.artifacts.path)/source.env
      . $(workspaces.artifacts.path)/params.env
      SCRIPT="${STEP}.sh"
      mkdir "${STEP}"
      cd "${STEP}"

      cat >"${SCRIPT}" <<EOF
      #!/usr/bin/env bash
      set -eo pipefail

      cd "${TREE}"
      make O="${BDIR}" ${OPTS} -j$(nproc) modules
      rm -rf "${BDIR}/_modules_"
      mkdir "${BDIR}/_modules_"
      make O="${BDIR}" ${OPTS} \
          INSTALL_MOD_PATH=_modules_ INSTALL_MOD_STRIP=1 modules_install
      cd "${BDIR}"
      tar czf modules.tar.gz -C _modules_ .
      ln -s "\$(pwd)/modules.tar.gz" "${PWD}/modules.tar.gz"
      EOF

      cat "${SCRIPT}"
      chmod 0755 "${SCRIPT}"
---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: step-run
  namespace: vixi
spec:
  params:
  - name: step
  - name: image
  - name: parent
  results:
  - name: node-id
    description: Id of the database node with the task's result
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  workspaces:
  - name: sandbox
  - name: artifacts

  steps:
  - name: script
    image: $(params.image)
    workingDir: $(workspaces.sandbox.path)/src
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    env:
    - { name: STEP,  value: $(params.step)  }
    script: |
      set -e
      . $(workspaces.artifacts.path)/global.env
      SCRIPT=$(workspaces.artifacts.path)/${STEP}/${STEP}.sh
      LOG=$(workspaces.artifacts.path)/${STEP}/${STEP}.txt
      STATUS=$(workspaces.artifacts.path)/${STEP}.status
      TIME_PX="$(workspaces.artifacts.path)/${STEP}"
      echo -n $(date -Iseconds) > "${TIME_PX}-start-time"
      mkdir -p "${JOB}"
      (
        set +e
        cd "${JOB}"
        "${SCRIPT}" 2>&1
        echo -n $? > "${STATUS}"
      ) | tee "${LOG}"
      echo -n $(date -Iseconds) > "${TIME_PX}-end-time"

  - name: result
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    workingDir: $(workspaces.sandbox.path)/src
    env:
    - { name: PARENT,      value: $(params.parent)                }
    - { name: STEP,        value: $(params.step)                  }
    - { name: PYTHONPATH,  value: $(workspaces.sandbox.path)/vixi }
    script: |
      #!/usr/bin/env python
      import sys
      import vixi.kbuild
      node = vixi.kbuild.add_result_node('$(workspaces.artifacts.path)')
      vixi.write_string('$(results.node-id.path)', node.id)
      print('  '.join((node.id, node.name)))
      urls = vixi.kbuild.upload_artifacts('$(workspaces.artifacts.path)', node)
      for url in urls:
          print(url)
      sys.exit(node.data.to_dict()['status'])
---

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-result
  namespace: vixi
spec:
  params:
  - name: uuid
  - name: status
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  workspaces:
  - name: sandbox
  - name: artifacts
  steps:
  - name: summary
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    env:
    - { name: PYTHONPATH,  value: $(workspaces.sandbox.path)/vixi }
    script: |
      #!/usr/bin/env python
      import vixi.kbuild
      vixi.write_string(
          '$(workspaces.artifacts.path)/result', '$(params.status)'
      )
      steps = ['checkout', 'defconfig', 'image', 'modules']
      node = vixi.kbuild.add_results('$(workspaces.artifacts.path)', steps)
      print('  '.join((node.id, node.name)))

  - name: complete
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: IfNotPresent
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    env:
    - { name: UUID, value: $(params.uuid) }
    script: |
      [ -n "${UUID}" ] && renelick task complete "${UUID}"
