apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-init
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  steps:
  - name: directory
    image: alpine:3.20
    workingDir: $(workspaces.sandbox.path)
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      mkdir -p kbuild
      chown 1000:1000 kbuild
      ls -l
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-mirror
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  - name: tmp
  params:
  - name: tree
    default: torvalds
  - name: url
    default: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  steps:
  - name: mirror
    image: alpine/git:v2.45.2
    workingDir: $(workspaces.sandbox.path)/mirror
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/mirror-start"

      tree=$(params.tree)
      url=$(params.url)
      echo "Tree: $(params.tree)"
      echo "URL:  $(params.url)"

      echo "Current mirrors:"
      find . -type d -name "*.git" | xargs du -hs

      if [ -d linux.git ]; then
          cd linux.git
          pwd
          git remote update
          git branch
          git log -n1
          cd - >/dev/null
      else
          git clone --mirror --verbose \
              https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      fi

      [ -d "$tree".git ] || {
          git clone --mirror --verbose --reference=linux.git "$url" "$tree".git
      }

      cd "$tree".git
      pwd
      git remote set-url origin "$url"
      git remote update --prune
      git branch
      git log -n1
      du -hs
      cd - >/dev/null
      df -h $(workspaces.sandbox.path)
      date -Iseconds > "$(workspaces.tmp.path)/mirror-end"

  - name: mirror-node
    image: registry.gitlab.com/gtucker.io/renelick:main
    workingDir: $(workspaces.sandbox.path)/mirror/$(params.tree).git
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      git config --global --add safe.directory \
          "$(workspaces.sandbox.path)/mirror/$(params.tree).git"
      git log -n1 > $(workspaces.tmp.path)/git-head.txt
      renelick node make \
          name="kbuild-mirror-$(params.tree)" \
          kind="vixi.mirror" \
          data.revision.sha1="${sha1}" \
          data.revision.describe="$(git describe)" \
          data.revision.subject="$(git show --format=%s -s)" \
          data.revision.tree="$(params.tree)" \
          data.revision.url="$(params.url)" \
          data.git-head__file="$(workspaces.tmp.path)/git-head.txt" \
          data.start-time="$(cat $(workspaces.tmp.path)/mirror-start)" \
          data.end-time="$(cat $(workspaces.tmp.path)/mirror-end)" \
      | renelick node add -
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  params:
  -  name: tree
  -  name: url
  -  name: revision
  - {name: arch,       default: x86_64}
  - {name: defconfig,  default: defconfig}
  - {name: opts,       default: ''}
  - {name: cc,         default: gcc}
  - {name: ccver,      default: 14.2}
  - {name: ccarch,     default: -x86}
  - {name: registry,   default: registry.gitlab.com/gtucker/korg/}
  - {name: bucket,     default: gs://vixi-sandbox}

  steps:
  - name: checkout
    image: alpine/git:v2.45.2
    workingDir: $(workspaces.sandbox.path)/kbuild
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      set -euo pipefail

      tree=$(params.tree)
      url=$(params.url)
      revision=$(params.revision)
      echo "Tree:     $tree"
      echo "URL:      $url"
      echo "Revision: $revision"

      mirror=$(workspaces.sandbox.path)/mirror/"$tree".git
      if [ ! -d "$tree" ]; then
          git clone --reference-if-able="$mirror" -v --depth=1 "$url" "$tree"
      fi

      cd "$tree"
      git remote -v
      git branch -a
      git fetch --tags origin "$revision"
      git checkout FETCH_HEAD
      git log -n1
      du -hs .git

  - name: build
    image: $(params.registry)$(params.cc):$(params.ccver)-x86$(params.ccarch)
    workingDir: $(workspaces.sandbox.path)/kbuild
    script: |
      #!/usr/bin/env bash
      set -euo pipefail

      tree=$(params.tree)
      arch=$(params.arch)
      cc=$(params.cc)
      ccver=$(params.ccver)
      compiler="$cc"-"$ccver"
      opts=$(params.opts)
      echo "Tree:          $tree"
      echo "Architecture:  $arch"
      echo "Compiler:      $compiler"
      echo "Options:       $opts"

      cd "$tree"
      bdir="build/$arch/$compiler"
      mkdir -p "$bdir"
      make O="$bdir" $opts defconfig
      make O="$bdir" $opts bzImage -j$(nproc)
      make O="$bdir" $opts modules -j$(nproc)
      ls -l "$bdir"/arch/"$arch"/boot/bzImage
