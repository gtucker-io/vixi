apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-init
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  steps:
  - name: directory
    image: alpine:3.20
    workingDir: $(workspaces.sandbox.path)
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      mkdir -p kbuild
      chown 1000:1000 kbuild
      ls -l
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild-mirror
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  - name: tmp
  params:
  - name: uuid
  - name: tree
  - name: url
  - name: reset
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  steps:
  - name: mirror
    image: alpine/git:v2.45.2
    workingDir: $(workspaces.sandbox.path)/mirror
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/mirror-start"

      tree=$(params.tree)
      url=$(params.url)
      echo "Tree: $(params.tree)"
      echo "URL:  $(params.url)"

      echo "Current mirrors:"
      find . -type d -name "*.git" | xargs du -hs

      [ "$(params.reset)" == "all" ] && {
          echo "Resetting all the mirrors"
          rm -rf *.git
      }

      if [ -d linux.git ]; then
          cd linux.git
          pwd
          git remote update
          git branch
          git log -n1
          cd - >/dev/null
      else
          git clone --mirror --verbose \
              https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
      fi

      [ "$(params.reset)" == "true" ] && {
          echo Resetting mirror for $tree.git
          rm -rf "$tree.git"
      }

      [ -d "$tree".git ] || {
          git clone --mirror --verbose --reference=linux.git "$url" "$tree".git
      }

      cd "$tree".git
      pwd
      git remote set-url origin "$url"
      git remote update --prune
      git branch
      git log -n1
      du -hs
      cd - >/dev/null
      df -h $(workspaces.sandbox.path)
      date -Iseconds > "$(workspaces.tmp.path)/mirror-end"

  - name: mirror-node
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    workingDir: $(workspaces.sandbox.path)/mirror/$(params.tree).git
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      git config --global --add safe.directory \
          "$(workspaces.sandbox.path)/mirror/$(params.tree).git"
      git log -n1 > $(workspaces.tmp.path)/git-head.txt
      if [ -n "$(params.uuid)" ]; then
          renelick task get $(params.uuid) > $(workspaces.tmp.path)/task.json
          task_param="task__json=$(workspaces.tmp.path)/task.json"
      else
          task_param="task__null="
      fi
      renelick node make \
          name="kbuild-mirror-$(params.tree)" \
          kind="vixi.mirror" \
          ${task_param} \
          data.revision.sha1="${sha1}" \
          data.revision.describe="$(git describe)" \
          data.revision.subject="$(git show --format=%s -s)" \
          data.revision.tree="$(params.tree)" \
          data.revision.url="$(params.url)" \
          data.git-head__file="$(workspaces.tmp.path)/git-head.txt" \
          data.start-time="$(cat $(workspaces.tmp.path)/mirror-start)" \
          data.end-time="$(cat $(workspaces.tmp.path)/mirror-end)" \
      | renelick node add -
      [ -n "$(params.uuid)" ] && renelick task complete $(params.uuid)
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kbuild
  namespace: vixi
spec:
  workspaces:
  - name: sandbox
  - name: tmp
  params:
  -  name: uuid
  -  name: tree
  -  name: url
  -  name: revision
  -  name: reset
  - {name: arch,       default: 'x86_64'}
  - {name: defconfig,  default: 'defconfig'}
  - {name: opts,       default: ''}
  - {name: cc,         default: 'gcc'}
  - {name: ccver,      default: '14.2'}
  - {name: ccarch,     default: '-x86'}
  - {name: registry,   default: registry.gitlab.com/gtucker/korg/}
  - {name: bucket,     default: gs://vixi-sandbox}
  volumes:
  - name: api-key
    secret:
      secretName: api-key
  results:
  - name: revision
    description: Kernel source tree checkout
  - name: build
    description: Kernel build

  steps:
  - name: root-node
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      renelick version
      renelick whoami

      if [ -n "$(params.uuid)" ]; then
          renelick task get $(params.uuid) > $(workspaces.tmp.path)/task.json
          task_param="task__json=$(workspaces.tmp.path)/task.json"
      else
          task_param="task__null="
      fi

      renelick node make \
          name="$(params.tree)-kbuild" \
          kind="vixi.kbuild" \
          ${task_param} \
          data.start-time="$(date -Iseconds)" \
      | renelick node add - | tee $(workspaces.tmp.path)/parent_id

  - name: checkout
    image: alpine/git:v2.45.2
    workingDir: $(workspaces.sandbox.path)/kbuild
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env ash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/checkout-start"

      tree=$(params.tree)
      url=$(params.url)
      revision=$(params.revision)
      echo "Tree:     $tree"
      echo "URL:      $url"
      echo "Revision: $revision"

      [ "$(params.reset)" == "true" ] && {
          echo Resetting checkout for $tree
          rm -rf "$tree"
      }

      mirror=$(workspaces.sandbox.path)/mirror/"$tree".git
      if [ ! -d "$tree" ]; then
          git clone --reference-if-able="$mirror" -v --depth=1 "$url" "$tree"
      fi

      cd "$tree"
      git remote -v
      git branch -a
      git fetch --tags origin "$revision"
      git checkout FETCH_HEAD
      git log -n1
      du -hs .git

      date -Iseconds > "$(workspaces.tmp.path)/checkout-end"

  - &result-node
    name: result-node
    env: [{name: STEP, value: checkout}]
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    workingDir: $(workspaces.sandbox.path)/kbuild/$(params.tree)
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      parent_path=$(workspaces.tmp.path)/parent_id
      [ -f "$parent_path" ] && popt="parent=$(cat $parent_path)"
      sha1=$(git show --format=%H -s)
      renelick node make \
          name="$(params.tree)-${sha1}-${STEP}" \
          kind="vixi.kbuild" \
          $popt \
          data.revision.sha1="$sha1" \
          data.revision.describe="$(git describe)" \
          data.revision.subject="$(git show --format=%s -s)" \
          data.revision.tree="$(params.tree)" \
          data.revision.url="$(params.url)" \
          data.start-time="$(cat $(workspaces.tmp.path)/${STEP}-start)" \
          data.end-time="$(cat $(workspaces.tmp.path)/${STEP}-end)" \
          data.step="${STEP}" \
      | renelick node add - | tee $(workspaces.tmp.path)/parent_id

  - name: defconfig
    image: $(params.registry)$(params.cc):$(params.ccver)-x86$(params.ccarch)
    imagePullPolicy: Always
    workingDir: $(workspaces.sandbox.path)/kbuild
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      tree=$(params.tree)
      arch=$(params.arch)
      cc=$(params.cc)
      ccver=$(params.ccver)
      compiler="$cc"-"$ccver"
      opts=$(params.opts)
      echo "Tree:          $tree"
      echo "Architecture:  $arch"
      echo "Compiler:      $compiler"
      echo "Options:       $opts"

      date -Iseconds > "$(workspaces.tmp.path)/defconfig-start"
      cd "$tree"
      bdir="build/$arch/$compiler"
      mkdir -p "$bdir"
      make O="$bdir" $opts defconfig
      make O="$bdir" $opts savedefconfig
      date -Iseconds > "$(workspaces.tmp.path)/defconfig-end"

  - <<: *result-node
    name: defconfig-node
    env: [{name: STEP, value: defconfig}]

  - &artifact-node
    name: defconfig-artifact
    env: [{name: ARTIFACT, value: defconfig}]
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    workingDir: $(workspaces.sandbox.path)/kbuild/$(params.tree)
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      compiler="$(params.cc)-$(params.ccver)"
      cd "build/$(params.arch)/$compiler"
      ls -l "${ARTIFACT}"
      url=$(renelick storage upload ${ARTIFACT} \
            --dest=kbuild-$(params.uuid) --storage=gtucker.io)
      echo "${url}"
      parent_path=$(workspaces.tmp.path)/parent_id
      renelick node make \
          name="$(basename ${ARTIFACT})" \
          kind="artifact-v1" \
          parent="$(cat ${parent_path})" \
          data.url="${url}" \
          data.storage="ssh" \
      | renelick node add -

  - name: image
    image: $(params.registry)$(params.cc):$(params.ccver)-x86$(params.ccarch)
    imagePullPolicy: Always
    workingDir: $(workspaces.sandbox.path)/kbuild
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/image-start"
      cd "$(params.tree)"
      compiler="$(params.cc)-$(params.ccver)"
      make O="build/$(params.arch)/$compiler" $(params.opts) -j$(nproc) bzImage
      ls -l "build/$(params.arch)/$compiler"/arch/"$(params.arch)"/boot/bzImage
      date -Iseconds > "$(workspaces.tmp.path)/image-end"

  - <<: *result-node
    name: image-node
    env: [{name: STEP, value: image}]

  - <<: *artifact-node
    name: image-artifact
    env: [{name: ARTIFACT, value: arch/$(params.arch)/boot/bzImage}]

  - name: modules
    image: $(params.registry)$(params.cc):$(params.ccver)-x86$(params.ccarch)
    imagePullPolicy: Always
    workingDir: $(workspaces.sandbox.path)/kbuild
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      set -eo pipefail

      date -Iseconds > "$(workspaces.tmp.path)/modules-start"
      cd "$(params.tree)"
      compiler="$(params.cc)-$(params.ccver)"
      bdir="build/$(params.arch)/$compiler"
      make O="${bdir}" $(params.opts) -j$(nproc) modules
      rm -rf "${bdir}/_modules_"
      mkdir "${bdir}/_modules_"
      make O="${bdir}" $(params.opts) \
          INSTALL_MOD_PATH=_modules_ INSTALL_MOD_STRIP=1 modules_install
      cd "${bdir}"
      tar czf modules.tar.gz -C _modules_ .
      date -Iseconds > "$(workspaces.tmp.path)/modules-end"

  - <<: *result-node
    name: modules-node
    env: [{name: STEP, value: modules}]

  - <<: *artifact-node
    name: modules-artifact
    env: [{name: ARTIFACT, value: modules.tar.gz}]

  - name: complete-task
    image: registry.gitlab.com/gtucker.io/renelick:main
    imagePullPolicy: Always
    volumeMounts:
    - name: api-key
      mountPath: /home/renelick/.config/renelick
    workingDir: $(workspaces.tmp.path)
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
    script: |
      #!/usr/bin/env bash
      [ -n "$(params.uuid)" ] && renelick task complete $(params.uuid)
      echo Done $(params.uuid)
