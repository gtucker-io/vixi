apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: kbuild
  namespace: vixi
spec:
  params:
  -   name: uuid
  -   name: storage
  -   name: tree
  -   name: url
  -   name: revision
  - { name: patches,    default: ''                                  }
  -   name: arch
  -   name: defconfig
  -   name: opts
  -   name: cc
  -   name: ccver
  -   name: ccarch
  - { name: registry,   default: 'docker.io/gtucker/korg-'           }
  - { name: job,        default: 'kbuild'                            }
  - { name: flags,      default: ''                                  }
  workspaces:
  - name: common
  - name: sandbox
  - name: artifacts
  tasks:

  # ---------------------------------------------------------------------------
  # init
  #
  - name: init
    taskRef:
      name: kbuild-init
    workspaces:
    - name: common
    - name: artifacts
    params:
    - { name: job,        value: $(params.job)        }
    - { name: uuid,       value: $(params.uuid)       }
    - { name: storage,    value: $(params.storage)    }
    - { name: tree,       value: $(params.tree)       }
    - { name: url,        value: $(params.url)        }
    - { name: revision,   value: $(params.revision)   }
    - { name: patches,    value: $(params.patches)    }
    - { name: arch,       value: $(params.arch)       }
    - { name: defconfig,  value: $(params.defconfig)  }
    - { name: opts,       value: $(params.opts)       }
    - { name: cc,         value: $(params.cc)         }
    - { name: ccver,      value: $(params.ccver)      }
    - { name: ccarch,     value: $(params.ccarch)     }
    - { name: flags,      value: $(params.flags)      }

  # ---------------------------------------------------------------------------
  # build scripts
  #
  - name: scripts
    runAfter:
    - init
    taskRef:
      name: kbuild-scripts
    workspaces:
    - name: common
    - name: sandbox
    - name: artifacts

  # ---------------------------------------------------------------------------
  # checkout
  #
  - &step-task
    name: checkout
    runAfter:
    - scripts
    taskRef:
      name: step-run
    workspaces:
    - name: common
    - name: sandbox
    - name: artifacts
    params:
    - { name: step,    value: checkout                                      }
    - { name: image,   value: registry.gitlab.com/gtucker.io/renelick:main  }
    - { name: parent,  value: ''                                            }

  # ToDo: group defconfig + image (+ dts) + modules in a single task with
  # several steps and keep the root node as the parent for each step?  Lineage
  # provides the order of the build steps, this could be improved with ordered
  # child nodes too as per https://gitlab.com/gtucker.io/renelick/-/issues/66

  # ---------------------------------------------------------------------------
  # defconfig
  #
  - <<: *step-task
    name: defconfig
    runAfter:
    - checkout
    params:
    - &ccimage
      name: image
      value: $(params.registry)$(params.cc):$(params.ccver)-x86$(params.ccarch)
    - name: step
      value: defconfig
    - name: parent
      value: $(tasks.checkout.results.node-id)

  # ---------------------------------------------------------------------------
  # image
  #
  - <<: *step-task
    name: image
    runAfter:
    - defconfig
    params:
    - <<: *ccimage
    - { name: step,        value: image                                     }
    - { name: parent,      value: $(tasks.defconfig.results.node-id)        }

  # ---------------------------------------------------------------------------
  # modules
  #
  - <<: *step-task
    name: modules
    runAfter:
    - image
    params:
    - <<: *ccimage
    - { name: step,        value: modules                                   }
    - { name: parent,      value: $(tasks.image.results.node-id)            }

  # ---------------------------------------------------------------------------
  # cleanup
  #
  finally:
  - name: complete
    taskRef:
      name: kbuild-result
    workspaces:
    - name: common
    - name: artifacts
    params:
    - { name: uuid,        value: $(params.uuid)                            }
    - { name: status,      value: $(tasks.status)                           }
