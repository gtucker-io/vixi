apiVersion: tekton.dev/v1
kind: TaskRun
metadata:
  generateName: vixi-kbuild-
  namespace: vixi
spec:
  taskRef:
    name: kbuild
  podTemplate:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: vixi/worker
              operator: In
              values: ["true"]
  params:
  - name: tree
    value: torvalds
  - name: url
    value: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  - name: revision
    value: master
  timeout: "1h0m0s"
  workspaces:
  - name: sandbox
    persistentVolumeClaim:
      claimName: kbuild-sandbox
  - name: tmp
    emptyDir: {}
