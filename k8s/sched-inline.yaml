apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-inline
  namespace: vixi
spec:
  replicas: 3
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: sched-inline
  template:
    metadata:
      labels:
        app: sched-inline
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: vixi/app
                operator: In
                values: ['true']
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      - name: common
        persistentVolumeClaim:
          claimName: common
      containers:
      - name: scheduler
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: common
          mountPath: /workspace/common
        # ToDo: add labels, also make the API filter based on the username
        command: ['/workspace/common/venv/bin/python', '-m', 'vixi.inline']
