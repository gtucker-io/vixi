apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kbuild-sandbox
  namespace: vixi
  annotations:
    user.custom.annotation/storage.thick-provisioned: "true"
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi
---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kboot-sandbox
  namespace: vixi
  annotations:
    user.custom.annotation/storage.thick-provisioned: "true"
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 12Gi
