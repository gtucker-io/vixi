apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox
  namespace: vixi
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-sandbox
  namespace: vixi
spec:
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 60
  completions: 1
  parallelism: 1
  template:
    metadata:
      name: init-sandbox
    spec:
      restartPolicy: Never
      volumes:
      - name: sandbox
        persistentVolumeClaim:
          claimName: sandbox
      initContainers:
      - name: directories
        image: alpine:3.22.1
        volumeMounts:
        - name: sandbox
          mountPath: /sandbox
        command:
        - 'ash'
        - '-c'
        - |
          set -eo pipefail
          install -d /sandbox/mirror -o 1000 -m 0755
          install -d /sandbox/src -o 1000 -m 0755
          ls -l /sandbox

      containers:
      - name: venv
        image: python:3.10
        volumeMounts:
        - name: sandbox
          mountPath: /workspace/sandbox
        workingDir: /workspace/sandbox
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
        command:
        - '/usr/bin/env'
        - 'bash'
        - '-c'
        - |
          set -eo pipefail
          python -m venv --system-site-packages venv
          (
              . venv/bin/activate
              pip install --upgrade pip
              pip uninstall -y vixi
              pip install git+https://gitlab.com/gtucker.io/vixi.git@main
          )
