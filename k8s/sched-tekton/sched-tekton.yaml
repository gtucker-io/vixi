apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-tekton
  namespace: vixi
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: sched-tekton
  template:
    metadata:
      labels:
        app: sched-tekton
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: vixi/app
                operator: In
                values: ['true']
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      - name: common
        persistentVolumeClaim:
          claimName: common
      containers:
      - name: scheduler
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: common
          mountPath: /workspace/common
        command:
        - '/workspace/common/venv/bin/python'
        - '-m'
        - 'vixi.tekton'
        - '--name'
        - 'tekton'
        - '--slot'
        - '0'
