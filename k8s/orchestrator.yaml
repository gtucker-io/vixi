apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: vixi
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: vixi/app
                operator: In
                values: ['true']
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      - name: common
        persistentVolumeClaim:
          claimName: common
      initContainers:
      - name: oconfig
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: common
          mountPath: /common
        command:
        - '/common/venv/bin/python'
        - '-m'
        - 'vixi.oconfig'
        - '--verbose'
        - '--dump'
        - '--url'
        - 'https://gitlab.com/gtucker.io/vixi/-/raw/main/vixi/oconfig.yaml?ref_type=heads'

      containers:
      - name: orchestrator
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: common
          mountPath: /common
        command: ['/common/venv/bin/python', '-m', 'vixi.orchestrator']
