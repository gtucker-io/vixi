apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: vixi
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: vixi/app
                operator: In
                values: ['true']
      volumes:
      - name: api-key
        secret:
          secretName: api-key
      - name: sandbox
        persistentVolumeClaim:
          claimName: sandbox
      initContainers:
      - name: oconfig
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: sandbox
          mountPath: /sandbox
        workingDir: /sandbox/vixi
        command:
        - '/usr/bin/env'
        - 'python'
        - '-m'
        - 'vixi.oconfig'
        - '--verbose'
        - '--dump'

      containers:
      - name: orchestrator
        image: registry.gitlab.com/gtucker.io/renelick:main
        imagePullPolicy: Always
        volumeMounts:
        - name: api-key
          mountPath: /home/renelick/.config/renelick
        - name: sandbox
          mountPath: /sandbox
        env:
        - name: PYTHONPATH  # development
          value: /sandbox/vixi
        command: ['/usr/bin/env', 'python', '-m', 'vixi.orchestrator']
