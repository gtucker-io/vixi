apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox
  namespace: vixi
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 100Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-sandbox
  namespace: vixi
spec:
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 60
  completions: 1
  parallelism: 1
  template:
    metadata:
      name: init-sandbox
    spec:
      restartPolicy: Never
      volumes:
      - name: sandbox
        persistentVolumeClaim:
          claimName: sandbox
      containers:
      - name: directories
        image: alpine:3.22.1
        volumeMounts:
        - name: sandbox
          mountPath: /sandbox
        command:
        - 'ash'
        - '-c'
        - |
          set -eo pipefail
          install -d /sandbox/src -o 1000 -m 0755
          ls -l /sandbox
